<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Вход</h2>
        <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Электронная почта</label>
                <input type="email" class="form-control" id="username" name="username" placeholder="Введите email" required maxlength="50" />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required minlength="8" maxlength="16" />
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
            <a href="/register" class="btn btn-link">Зарегистрироваться</a>
        </form>

        <div id="message"></div>
    </div>
</body>
</html>
